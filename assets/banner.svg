<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Node Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b224ef" />
      <stop offset="100%" stop-color="#7579ff" />
    </linearGradient>

    <!-- Radial Glow for Central Ring -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
    }

    /* Ambient Dynamic Animations */
    @keyframes pulseRing1 {
      0% { r: 110px; opacity: 0.25; }
      50% { r: 135px; opacity: 0.55; }
      100% { r: 110px; opacity: 0.25; }
    }
    @keyframes pulseRing2 {
      0% { r: 160px; opacity: 0.15; }
      50% { r: 185px; opacity: 0.35; }
      100% { r: 160px; opacity: 0.15; }
    }
    @keyframes orbitNode {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes orbitNodeReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.4; }
      50% { transform: translateY(-12px) scale(1.2); opacity: 0.85; }
    }

    .pulse-1 { animation: pulseRing1 6s ease-in-out infinite; }
    .pulse-2 { animation: pulseRing2 8s ease-in-out infinite; }
    .rotating-group-1 { transform-origin: 970px 180px; animation: orbitNode 22s linear infinite; }
    .rotating-group-2 { transform-origin: 970px 180px; animation: orbitNodeReverse 28s linear infinite; }
    .particle-a { animation: floatParticle 4s ease-in-out infinite; }
    .particle-b { animation: floatParticle 5s ease-in-out infinite 1.5s; }
    .particle-c { animation: floatParticle 6s ease-in-out infinite 3s; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Digital Grid Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="100" cy="50" r="160" fill="url(#halo)" />
  <circle cx="970" cy="180" r="220" fill="url(#halo)" />

  <!-- BACKGROUND DYNAMIC ANIMATED ELEMENTS (RIGHT SIDE / ORBITAL DATA GRAPH) -->
  <g id="dynamic-network">
    <!-- Animated Concentric Radar Rings -->
    <circle cx="970" cy="180" r="120" class="pulse-1" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 6" />
    <circle cx="970" cy="180" r="170" class="pulse-2" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 8" />

    <!-- Static Central Hub Core -->
    <circle cx="970" cy="180" r="42" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5" filter="url(#glow)" />
    <!-- Customer Icon Silhouette in Hub -->
    <path d="M 970 168 A 10 10 0 1 0 970 188 A 10 10 0 1 0 970 168 Z M 956 199 C 956 191 962 189 970 189 C 978 189 984 191 984 199 Z" fill="#38bdf8" />

    <!-- Orbiting Layer 1 (Clockwise) -->
    <g class="rotating-group-1">
      <!-- Node: Event Stream -->
      <line x1="970" y1="180" x2="970" y2="65" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 3" />
      <circle cx="970" cy="65" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <circle cx="970" cy="65" r="6" fill="#38bdf8" />

      <!-- Node: Identity Resolution -->
      <line x1="970" y1="180" x2="1080" y2="245" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 3" />
      <circle cx="1080" cy="245" r="15" fill="#0f172a" stroke="#c084fc" stroke-width="2" />
      <circle cx="1080" cy="245" r="6" fill="#c084fc" />

      <!-- Node: Warehouse Sync -->
      <line x1="970" y1="180" x2="860" y2="245" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 3" />
      <circle cx="860" cy="245" r="13" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
      <circle cx="860" cy="245" r="5" fill="#818cf8" />
    </g>

    <!-- Orbiting Layer 2 (Counter-Clockwise) -->
    <g class="rotating-group-2">
      <!-- Satellites -->
      <circle cx="970" cy="20" r="5" fill="#00f2fe" filter="url(#glow)" />
      <circle cx="1110" cy="115" r="7" fill="#818cf8" filter="url(#glow)" />
      <circle cx="830" cy="130" r="6" fill="#c084fc" filter="url(#glow)" />
      <circle cx="970" cy="340" r="5" fill="#38bdf8" filter="url(#glow)" />
    </g>

    <!-- Floating Particles -->
    <circle cx="780" cy="90" r="3" fill="#38bdf8" class="particle-a" />
    <circle cx="740" cy="270" r="4" fill="#a855f7" class="particle-b" />
    <circle cx="1130" cy="280" r="3.5" fill="#00f2fe" class="particle-c" />
  </g>

  <!-- FOREGROUND CONTENT (LEFT/CENTER) - HIGH CONTRAST & NEVER HIDDEN -->
  <g id="foreground-typography">
    <!-- Category Badge Pill -->
    <rect x="70" y="55" width="230" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="87" cy="70" r="5" fill="#38bdf8" filter="url(#glow)" />
    <text x="102" y="75" class="tag-text">ENTERPRISE &amp; OPEN SOURCE</text>

    <!-- Main Title -->
    <text x="70" y="140" class="title-text">Awesome Customer 360</text>
    
    <!-- Accent Line Gradient -->
    <rect x="70" y="156" width="380" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle / Value Proposition -->
    <text x="70" y="196" class="subtitle-text">Curated ecosystem of Customer Data Platforms (CDPs),</text>
    <text x="70" y="224" class="subtitle-text">identity resolution engines, and real-time activation systems.</text>

    <!-- Pillar Badges Pill Group -->
    <g transform="translate(70, 260)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
      <text x="82" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Data Unification</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="180" height="34" rx="17" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
      <text x="265" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc" text-anchor="middle">Identity Resolution</text>

      <!-- Pill 3 -->
      <rect x="365" y="0" width="185" height="34" rx="17" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
      <text x="457" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e9d5ff" text-anchor="middle">Real-Time Activation</text>
    </g>
  </g>
</svg>
