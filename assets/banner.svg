<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cyanGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="purpleGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#b224ef"/><stop offset="100%" stop-color="#7579ff"/></linearGradient><radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".3"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient><filter id="glow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseRing1{0%{r:110px;opacity:.25}50%{r:135px;opacity:.55}}@keyframes pulseRing2{0%{r:160px;opacity:.15}50%{r:185px;opacity:.35}}@keyframes orbitNode{0%{transform:rotate(0deg)}}@keyframes orbitNodeReverse{0%{transform:rotate(360deg)}}@keyframes floatParticle{0%{transform:translateY(0) scale(1);opacity:.4}50%{transform:translateY(-12px) scale(1.2);opacity:.85}}.subtitle-text,.tag-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:46px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:19px;fill:#94a3b8;letter-spacing:.2px}.tag-text{font-weight:600;font-size:13px;fill:#38bdf8;letter-spacing:1.5px}.pulse-1{animation:pulseRing1 6s ease-in-out infinite}.pulse-2{animation:pulseRing2 8s ease-in-out infinite}.rotating-group-1,.rotating-group-2{transform-origin:970px 180px;animation:orbitNode 22s linear infinite}.rotating-group-2{animation:orbitNodeReverse 28s linear infinite}.particle-a{animation:floatParticle 4s ease-in-out infinite}.particle-b{animation:floatParticle 5s ease-in-out infinite 1.5s}.particle-c{animation:floatParticle 6s ease-in-out infinite 3s}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g stroke="#fff" stroke-width="1" opacity=".08"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="150" x2="150" y1="0" y2="360"/><line x1="300" x2="300" y1="0" y2="360"/><line x1="450" x2="450" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="750" x2="750" y1="0" y2="360"/><line x1="900" x2="900" y1="0" y2="360"/><line x1="1050" x2="1050" y1="0" y2="360"/></g><circle cx="100" cy="50" r="160" fill="url(#halo)"/><circle cx="970" cy="180" r="220" fill="url(#halo)"/><g id="dynamic-network"><circle cx="970" cy="180" r="120" fill="none" stroke="#6366f1" stroke-dasharray="4 6" stroke-width="1.5" class="pulse-1"/><circle cx="970" cy="180" r="170" fill="none" stroke="#38bdf8" stroke-dasharray="6 8" stroke-width="1" class="pulse-2"/><circle cx="970" cy="180" r="42" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5" filter="url(#glow)"/><path fill="#38bdf8" d="M 970 168 A 10 10 0 1 0 970 188 A 10 10 0 1 0 970 168 Z M 956 199 C 956 191 962 189 970 189 C 978 189 984 191 984 199 Z"/><g class="rotating-group-1"><line x1="970" x2="970" y1="180" y2="65" stroke="#38bdf8" stroke-dasharray="2 3" stroke-opacity=".5" stroke-width="1"/><circle cx="970" cy="65" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><circle cx="970" cy="65" r="6" fill="#38bdf8"/><line x1="970" x2="1080" y1="180" y2="245" stroke="#c084fc" stroke-dasharray="2 3" stroke-opacity=".5" stroke-width="1"/><circle cx="1080" cy="245" r="15" fill="#0f172a" stroke="#c084fc" stroke-width="2"/><circle cx="1080" cy="245" r="6" fill="#c084fc"/><line x1="970" x2="860" y1="180" y2="245" stroke="#818cf8" stroke-dasharray="2 3" stroke-opacity=".5" stroke-width="1"/><circle cx="860" cy="245" r="13" fill="#0f172a" stroke="#818cf8" stroke-width="2"/><circle cx="860" cy="245" r="5" fill="#818cf8"/></g><g class="rotating-group-2"><circle cx="970" cy="20" r="5" fill="#00f2fe" filter="url(#glow)"/><circle cx="1110" cy="115" r="7" fill="#818cf8" filter="url(#glow)"/><circle cx="830" cy="130" r="6" fill="#c084fc" filter="url(#glow)"/><circle cx="970" cy="340" r="5" fill="#38bdf8" filter="url(#glow)"/></g><circle cx="780" cy="90" r="3" fill="#38bdf8" class="particle-a"/><circle cx="740" cy="270" r="4" fill="#a855f7" class="particle-b"/><circle cx="1130" cy="280" r="3.5" fill="#00f2fe" class="particle-c"/></g><g id="foreground-typography"><rect width="230" height="30" x="70" y="55" fill="#1e293b" stroke="#334155" stroke-width="1.2" rx="15"/><circle cx="87" cy="70" r="5" fill="#38bdf8" filter="url(#glow)"/><text x="102" y="75" class="tag-text">ENTERPRISE &amp; OPEN SOURCE</text><text x="70" y="140" class="title-text">Awesome Customer 360</text><rect width="380" height="4" x="70" y="156" fill="url(#accentGrad)" rx="2"/><text x="70" y="196" class="subtitle-text">Curated ecosystem of Customer Data Platforms (CDPs),</text><text x="70" y="224" class="subtitle-text">identity resolution engines, and real-time activation systems.</text><g transform="translate(70, 260)"><rect width="165" height="34" x="0" y="0" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" rx="17"/><text x="82" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Data Unification</text><rect width="180" height="34" x="175" y="0" fill="#0f172a" stroke="#818cf8" stroke-width